# On a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release): checks the tag, runs CI, builds the release files twice
# to check that they're reproducible, and creates a draft GitHub release for a maintainer to review and publish.
#
# A tag push runs this file as it is at the tagged commit, so only a signed tag on a commit already on main is
# released. Only the maintainer can create v* tags (tag ruleset). Never add pull_request_target or workflow_run
# triggers that check out pull request code: those give it write access.
#
# Built here: the command-line tool for Linux, Windows, and macOS (amd64 and arm64), the Windows desktop app, and the
# Linux desktop app. The Linux app is built on the oldest supported Ubuntu so it runs on older distributions. The macOS
# desktop app isn't released until it can be signed and notarized; CI still builds and tests it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a signed tag on a commit that's on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG isn't a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"; exit 1
          fi
          read -r verified target < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" \
            --jq '"\(.verification.verified) \(.object.sha)"')
          if [ "$verified" != true ]; then
            echo "::error::GitHub can't verify the signature on $TAG"; exit 1
          fi
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $target, not $GITHUB_SHA"; exit 1
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG points at $GITHUB_SHA, which isn't on main"; exit 1
          fi

  ci:
    name: CI
    needs: tag
    uses: $/.github/workflows/ci.yml

  build:
    name: Build release files
    needs: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      go: ${{ steps.build.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false # release builds never start from a cache

      - name: Install the desktop app's build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Build twice and compare
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          scripts/build.sh "$version"
          mv dist dist-first
          go clean -cache
          scripts/build.sh "$version"
          diff dist-first/SHA256SUMS dist/SHA256SUMS
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Add the license notices
        run: |
          cp LICENSE NOTICE dist/
          cp cmd/vita-decrypt-gui/fonts/Fraunces-OFL.txt cmd/vita-decrypt-gui/fonts/Inter-OFL.txt dist/
          cp cmd/vita-decrypt-gui/icons/LICENSE dist/Lucide-LICENSE.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GO_VERSION: ${{ needs.build.outputs.go }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          notes="Built with ${GO_VERSION} from ${GITHUB_SHA}. Running \`scripts/build.sh ${TAG#v}\` with the same Go"
          notes+=" version gives the same SHA256SUMS for the command-line tool and the Windows app."
          gh release create "$TAG" dist/* "${flags[@]}" --notes "$notes" --repo "$GITHUB_REPOSITORY"
