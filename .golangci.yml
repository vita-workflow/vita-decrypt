# Linters that enforce docs/coding-standards.md. Run with: go tool -modfile=tools/go.mod golangci-lint run
version: "2"

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nestif
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unparam
    - unused
    - varnamelen

  settings:
    # Section 1.3: the only short names allowed. Everything else is a whole word.
    varnamelen:
      max-distance: 1
      min-name-length: 3
      check-receiver: true
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names: [err, ctx, gtx, ok, i, j]
      ignore-decls:
        - t *testing.T
        - b *testing.B
        - f *testing.F
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 16
    nestif:
      min-complexity: 5
    lll:
      line-length: 120
      tab-width: 4
    dupl:
      threshold: 120
    goconst:
      min-len: 3
      min-occurrences: 3
    exhaustive:
      default-signifies-exhaustive: false
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unused-receiver
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: context-as-argument
        - name: blank-imports
    staticcheck:
      checks: ["all", "-ST1000"] # ST1000 (package comments) is covered by revive

  exclusions:
    generated: strict
    rules:
      # G304 flags opening a file whose path is a variable. Opening the files the user chose is what these programs do.
      - linters: [gosec]
        text: "G304:"
      # Long tables of test cases are expected to look alike.
      - path: _test\.go
        linters: [dupl, funlen, goconst]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/vita-workflow/vita-decrypt]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
